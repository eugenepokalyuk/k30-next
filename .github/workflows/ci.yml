name: CI

# Проверка на пул-реквестах. Без неё ветка зелёная не потому, что код
# рабочий, а потому что никто не смотрел.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Линтеры
        run: npm run lint

      - name: Сборка
        # next build прогоняет и TypeScript — отдельного шага не нужно.
        # Ошибка типов здесь означает, что на прод она бы не уехала.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      - name: Экспорт не пустой
        # Молча сломанный экспорт выглядит как успешная сборка: out/ есть,
        # а страниц в нём нет. Проверяем главную и ключевые разделы.
        run: |
          for page in index activate login register account; do
            test -f "out/$page/index.html" -o -f "out/$page.html" || {
              echo "не собралась страница $page"; exit 1; }
          done
          echo "экспорт на месте: $(find out -name '*.html' | wc -l | xargs) страниц"
